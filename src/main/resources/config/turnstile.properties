# Cloudflare Turnstile Configuration
# Provide site and secret keys via environment-specific configuration.
salmon-spark.cloudflare.turnstile.site-key=
salmon-spark.cloudflare.turnstile.secret=
salmon-spark.cloudflare.turnstile.base-url=https://challenges.cloudflare.com

# Timeout configuration (in seconds)
salmon-spark.cloudflare.turnstile.connect-timeout=5
salmon-spark.cloudflare.turnstile.read-timeout=10

# Monitoring and metrics configuration
salmon-spark.cloudflare.turnstile.metrics.enabled=true
salmon-spark.cloudflare.turnstile.metrics.health-check-enabled=true
salmon-spark.cloudflare.turnstile.metrics.error-threshold=10

# Configuration for TurnstileCaptchaFilter component (for use with Spring Security Form Login, etc...)
salmon-spark.cloudflare.turnstile.login.submissionPath=/login
salmon-spark.cloudflare.turnstile.login.redirectUrl=/login?error=captcha
salmon-spark.cloudflare.turnstile.token.parameterName=cloudflare-turnstile-response
